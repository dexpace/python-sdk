[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "dexpace-sdk-http-aiohttp"
version = "0.1.0"
description = "aiohttp-backed async HTTP transport for dexpace-sdk-core."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Omar Aljarrah", email = "o.mazari.om63@gmail.com" }]
keywords = ["sdk", "http", "aiohttp", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "dexpace-sdk-core>=0.1,<0.2",
    # The adapter maps aiohttp's connect-vs-read timeout split
    # (ConnectionTimeoutError / SocketTimeoutError), added in aiohttp 3.10, so
    # 3.10 is the real floor. On Python 3.14 the floor rises to 3.13, the first
    # release with a 3.14 wheel (3.14 rejects break/continue/return inside a
    # finally block, a pattern aiohttp used until 3.13).
    "aiohttp>=3.10,<4.0; python_version < '3.14'",
    "aiohttp>=3.13,<4.0; python_version >= '3.14'",
]

[project.urls]
Homepage = "https://github.com/dexpace/python-sdk"
Documentation = "https://github.com/dexpace/python-sdk/tree/main/docs"
Repository = "https://github.com/dexpace/python-sdk"
Issues = "https://github.com/dexpace/python-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dexpace/sdk/http/aiohttp"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md"]
